[package]
name = "tearoff-notepad"
version = "0.1.0"
description = "A physical tear-off spiral notepad desktop widget"
authors = ["Susmitha Rajendran"]
edition = "2026"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-autostart = "2.0"
