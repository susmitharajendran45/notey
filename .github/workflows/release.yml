name: Release Desktop Widget

on:
  push:
    branches:
      - main       # Runs automatically whenever you edit or commit any code to main!
    tags:
      - 'v*'       # Still creates the public release when you make a tag!
  workflow_dispatch: # Adds a manual "Run workflow" button in the Actions tab!

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'macos-latest'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate All Icon Formats
        run: npx @tauri-apps/cli icon src-tauri/icons/icon.png

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Tear-Off Notepad ${{ github.ref_name }}'
          releaseBody: 'Installable desktop widget for Windows and macOS!'
          releaseDraft: false
          prerelease: false
