<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-surface: #FAFAFA;
      --bg-accent: #F4F4F5;
      --border-color: #E4E4E7;
      --border-focus: #18181B;
      --text-main: #09090B;
      --text-muted: #71717A;
      --line-grid: rgba(24, 24, 27, 0.05);
      --row-height: 28px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      user-select: none;
    }

    .icon {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .widget-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 6px;
    }

    .widget-frame {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
      position: relative;
    }

    /* Executive Clean Titlebar & Drag Region */
    .titlebar {
      height: 34px;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-color);
      cursor: grab;
      -webkit-app-region: drag;
    }
    .titlebar:active { cursor: grabbing; }

    .titlebar-left, .titlebar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .app-brand {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 3px 6px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.12s ease;
      -webkit-app-region: no-drag;
    }
    .btn-action:hover {
      background: var(--bg-accent);
      color: var(--text-main);
      border-color: var(--border-color);
    }
    .btn-action.active {
      background: var(--text-main);
      color: #FFF;
      border-color: var(--text-main);
    }

    .btn-close {
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 11px;
      color: var(--text-muted);
      border: none;
      background: transparent;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    .btn-close:hover {
      background: #EF4444;
      color: #FFFFFF;
    }

    /* Writing Canvas */
    .content-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-app-region: no-drag;
    }

    .editor-canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 16px 48px 16px;
      outline: none;
      font-size: 14px;
      line-height: var(--row-height);
      color: var(--text-main);
      cursor: text;
      user-select: text;
      background-image: repeating-linear-gradient(
        transparent,
        transparent calc(var(--row-height) - 1px),
        var(--line-grid) calc(var(--row-height) - 1px),
        var(--line-grid) var(--row-height)
      );
      background-position: 0 4px;
    }

    .editor-canvas:empty::before {
      content: "Type note or click + Task, + Table below...";
      color: var(--text-muted);
      pointer-events: none;
    }

    .editor-canvas p, .editor-canvas div:not(.task-row):not(.table-container) {
      min-height: var(--row-height);
      line-height: var(--row-height);
      margin: 0;
    }

    /* Streamlined Task Checklist */
    .task-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: var(--row-height);
      line-height: var(--row-height);
      user-select: text;
      margin: 2px 0;
    }
    .task-checkbox {
      appearance: none;
      width: 15px;
      height: 15px;
      border: 1.5px solid #A1A1AA;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
      background: #FFFFFF;
      position: relative;
    }
    .task-checkbox:checked {
      background: var(--text-main);
      border-color: var(--text-main);
    }
    .task-checkbox:checked::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 1px;
      width: 4px;
      height: 8px;
      border: solid #FFFFFF;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .task-input {
      outline: none;
      flex: 1;
      font-size: 14px;
      color: var(--text-main);
    }
    .task-input.completed {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Clean Engineering Table */
    .table-container {
      margin: 12px 0;
      position: relative;
      user-select: text;
      width: 100%;
    }
    .table-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 4px;
      user-select: none;
      font-size: 10px;
    }
    .tbl-btn {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .tbl-btn:hover {
      background: var(--bg-accent);
      color: var(--text-main);
    }
    .tbl-btn.tbl-danger { color: #EF4444; margin-left: auto; }
    .tbl-btn.tbl-danger:hover { background: #FEF2F2; }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }
    .data-table th {
      background: var(--bg-accent);
      border: 1px solid var(--border-color);
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      text-align: left;
      outline: none;
      position: relative;
    }
    .data-table td {
      border: 1px solid var(--border-color);
      padding: 6px 8px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
    }
    .data-table th:focus, .data-table td:focus {
      background: #FAFAFA;
      box-shadow: inset 0 0 0 1px var(--text-main);
    }

    .col-resizer {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      cursor: col-resize;
      user-select: none;
    }
    .col-resizer:hover { background: var(--text-main); }

    /* Calendar Popover */
    .popover-panel {
      position: absolute;
      top: 40px;
      left: 10px;
      width: 250px;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      padding: 10px;
      z-index: 100;
      display: none;
    }
    .popover-panel.visible { display: block; }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
      font-size: 11px;
      margin-top: 6px;
    }
    .cal-day {
      padding: 4px 0;
      border-radius: 4px;
      cursor: pointer;
    }
    .cal-day:hover { background: var(--bg-accent); }
    .cal-day.today { background: var(--text-main); color: #FFF; font-weight: 600; }

    /* Minimalist Footer Bar */
    .footer-bar {
      height: 32px;
      background: #FFFFFF;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .footer-btn-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .footer-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      color: var(--text-main);
      cursor: pointer;
    }
    .footer-btn:hover { background: var(--bg-accent); }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="widget-frame">
      
      <!-- Window Titlebar -->
      <div class="titlebar" data-tauri-drag-region>
        <div class="titlebar-left">
          <span class="app-brand">
            <svg class="icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            Memo
          </span>
          <button class="btn-action" onclick="toggleCalendar(event)">
            <svg class="icon"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span id="dateBadge">Date</span>
          </button>
        </div>

        <div class="titlebar-right">
          <button class="btn-close" onclick="terminateApp(event)" title="Close Window (Alt+F4)">✕</button>
        </div>
      </div>

      <!-- Calendar Panel -->
      <div class="popover-panel" id="calendarPanel">
        <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:600;">
          <span id="calMonthYear">Month Year</span>
          <button class="tbl-btn" onclick="toggleCalendar(event)">✕</button>
        </div>
        <div class="cal-grid" id="calCells"></div>
      </div>

      <!-- Content Viewport -->
      <div class="content-viewport">
        <div 
          class="editor-canvas" 
          id="editorContent" 
          contenteditable="true" 
          spellcheck="false"
        ></div>
      </div>

      <!-- Professional Compact Footer -->
      <div class="footer-bar">
        <div class="footer-btn-group">
          <button class="footer-btn" onclick="insertChecklist()">+ Task</button>
          <button class="footer-btn" onclick="insertTable()">+ Table</button>
          <button class="footer-btn" onclick="clearSheet()">Clear</button>
        </div>
        <span id="statsLabel">0 words</span>
      </div>

    </div>
  </div>

<script>
  // Clean Native Process Termination (Guaranteed No Ghost Overlay)
  async function terminateApp(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    try {
      if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
        await window.__TAURI__.core.invoke('exit_app');
        return;
      }
    } catch(err) {
      console.error(err);
    }
    window.close();
  }

  // Window drag fallback listener
  document.querySelector('.titlebar').addEventListener('mousedown', (e) => {
    if (e.target.closest('button')) return;
    if (window.__TAURI__ && window.__TAURI__.window) {
      window.__TAURI__.window.getCurrentWindow().startDragging();
    }
  });

  const editor = document.getElementById('editorContent');
  const stats = document.getElementById('statsLabel');

  editor.addEventListener('input', () => {
    const text = editor.innerText.replace(/[\n\r]+/g, ' ').trim();
    const count = text ? text.split(/\s+/).length : 0;
    stats.innerText = `${count} word${count === 1 ? '' : 's'}`;
  });

  /* Task Keyboard Shortcuts: Enter for new item, Backspace to remove */
  editor.addEventListener('keydown', (e) => {
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    const taskRow = sel.anchorNode?.parentElement?.closest('.task-row');

    if (taskRow) {
      const input = taskRow.querySelector('.task-input');
      if (e.key === 'Enter') {
        e.preventDefault();
        const next = document.createElement('div');
        next.className = 'task-row';
        next.innerHTML = `
          <input type="checkbox" class="task-checkbox" onchange="this.nextElementSibling.classList.toggle('completed', this.checked)">
          <div class="task-input" contenteditable="true"></div>
        `;
        taskRow.after(next);
        next.querySelector('.task-input').focus();
      } else if (e.key === 'Backspace' && (!input.innerText || input.innerText.trim() === '')) {
        e.preventDefault();
        taskRow.remove();
      }
    }
  });

  function insertChecklist() {
    const row = document.createElement('div');
    row.className = 'task-row';
    row.innerHTML = `
      <input type="checkbox" class="task-checkbox" onchange="this.nextElementSibling.classList.toggle('completed', this.checked)">
      <div class="task-input" contenteditable="true"></div>
    `;
    insertNode(row);
    row.querySelector('.task-input').focus();
  }

  /* Robust Engineering Table */
  function insertTable() {
    const id = 'tbl_' + Date.now();
    const wrapper = document.createElement('div');
    wrapper.className = 'table-container';
    wrapper.id = id;
    wrapper.contentEditable = "false";
    wrapper.innerHTML = `
      <div class="table-actions">
        <button class="tbl-btn" onclick="addTableRow('${id}')">+ Row</button>
        <button class="tbl-btn" onclick="addTableCol('${id}')">+ Col</button>
        <button class="tbl-btn" onclick="delTableRow('${id}')">- Row</button>
        <button class="tbl-btn" onclick="delTableCol('${id}')">- Col</button>
        <button class="tbl-btn tbl-danger" onclick="document.getElementById('${id}').remove()">✕</button>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th contenteditable="true">Col 1<div class="col-resizer"></div></th>
            <th contenteditable="true">Col 2<div class="col-resizer"></div></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td contenteditable="true"></td>
            <td contenteditable="true"></td>
          </tr>
        </tbody>
      </table>
    `;
    insertNode(wrapper);
    bindResizers(wrapper);
  }

  function addTableRow(id) {
    const tbody = document.querySelector('#' + id + ' tbody');
    const cols = document.querySelectorAll('#' + id + ' thead th').length;
    const row = tbody.insertRow();
    for (let i = 0; i < cols; i++) {
      const cell = row.insertCell();
      cell.contentEditable = "true";
    }
  }

  function delTableRow(id) {
    const tbody = document.querySelector('#' + id + ' tbody');
    if (tbody.rows.length > 1) tbody.deleteRow(-1);
  }

  function addTableCol(id) {
    const headerRow = document.querySelector('#' + id + ' thead tr');
    const th = document.createElement('th');
    th.contentEditable = "true";
    th.innerHTML = `Col ${headerRow.children.length + 1}<div class="col-resizer"></div>`;
    headerRow.appendChild(th);

    const rows = document.querySelectorAll('#' + id + ' tbody tr');
    rows.forEach(r => {
      const cell = r.insertCell();
      cell.contentEditable = "true";
    });
    bindResizers(document.getElementById(id));
  }

  function delTableCol(id) {
    const headerRow = document.querySelector('#' + id + ' thead tr');
    if (headerRow.children.length <= 1) return;
    headerRow.deleteCell(-1);

    const rows = document.querySelectorAll('#' + id + ' tbody tr');
    rows.forEach(r => {
      if (r.cells.length > 1) r.deleteCell(-1);
    });
  }

  function bindResizers(wrapper) {
    wrapper.querySelectorAll('.col-resizer').forEach(resizer => {
      resizer.onmousedown = function (e) {
        e.preventDefault();
        e.stopPropagation();
        const th = resizer.parentElement;
        const startX = e.pageX;
        const startWidth = th.offsetWidth;

        function move(m) {
          th.style.width = Math.max(50, startWidth + (m.pageX - startX)) + 'px';
        }
        function stop() {
          window.removeEventListener('mousemove', move);
          window.removeEventListener('mouseup', stop);
        }
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', stop);
      };
    });
  }

  function insertNode(node) {
    const sel = window.getSelection();
    if (sel && sel.rangeCount && editor.contains(sel.anchorNode)) {
      const range = sel.getRangeAt(0);
      range.deleteContents();
      range.insertNode(node);
      range.collapse(false);
    } else {
      editor.appendChild(node);
    }
  }

  function clearSheet() {
    if (confirm('Clear current note?')) {
      editor.innerHTML = '';
      stats.innerText = '0 words';
    }
  }

  /* Date & Calendar */
  const calPanel = document.getElementById('calendarPanel');
  function toggleCalendar(e) {
    e.stopPropagation();
    calPanel.classList.toggle('visible');
    if (calPanel.classList.contains('visible')) renderCalendar();
  }

  function renderCalendar() {
    const now = new Date();
    document.getElementById('calMonthYear').innerText = now.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
    const cells = document.getElementById('calCells');
    cells.innerHTML = '';

    const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
    const totalDays = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) cells.appendChild(document.createElement('div'));

    for (let d = 1; d <= totalDays; d++) {
      const el = document.createElement('div');
      el.className = 'cal-day' + (d === now.getDate() ? ' today' : '');
      el.innerText = d;
      el.onclick = () => {
        document.getElementById('dateBadge').innerText = `${now.toLocaleDateString('en-US', { month: 'short' })} ${d}`;
        calPanel.classList.remove('visible');
      };
      cells.appendChild(el);
    }
  }

  document.addEventListener('click', (e) => {
    if (!calPanel.contains(e.target)) calPanel.classList.remove('visible');
  });

  // Stamp current date by default
  document.getElementById('dateBadge').innerText = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
</script>
</body>
</html>
